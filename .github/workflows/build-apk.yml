name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use a separate package ID for pull-request test APKs
        if: github.event_name == 'pull_request'
        run: |
          sed -i "s/applicationId 'com.dalilmanbij.app.preview'/applicationId 'com.dalilmanbij.app.performance'/" app/build.gradle
          sed -i "s/versionName '1.0.1'/versionName '1.0.1-performance'/" app/build.gradle

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalil-manbij-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to stable download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: دليل منبج - التنزيل المباشر
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            ملف APK المبني من أحدث نسخة ناجحة من الفرع main.
            رابط التنزيل المباشر ثابت لبوابة تنزيل دليل منبج.
